  <!-- Automatic Stale Bundle Auto-Reload Guard (Fixes "Unexpected token '<'" on new deployments) -->
  <script>
    (function () {
      var reloadKey = 'mayko_auto_reload_ts';
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) ? e.message : '';
        var targetTag = (e && e.target && e.target.tagName) ? e.target.tagName : '';
        var isChunkError = msg.indexOf('Unexpected token') !== -1 || msg.indexOf('SyntaxError') !== -1 || targetTag === 'SCRIPT';
        if (isChunkError) {
          var lastReload = sessionStorage.getItem(reloadKey);
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > 8000) {
            sessionStorage.setItem(reloadKey, now.toString());
            window.location.reload(true);
          }
        }
      }, true);
    })();
  </script>
